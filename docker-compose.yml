services:
  app: #berisi data server dan aplikasi (laravel dan php)
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    #restart: unless-stopped -> akan digunakan nanti jika ingin otomatis compose up -d

  mysql: #berisi data database aplikasi
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: managementwifi
      MYSQL_USER: ega
      MYSQL_PASSWORD: qwerty
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    #restart: unless-stopped -> akan digunakan nanti jika ingin otomatis compose up -d
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: management-wifi-phpmyadmin
    ports:
        - "8080:80"
    environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
    depends_on:
        - mysql

volumes:
  mysql_data:
